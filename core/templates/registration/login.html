{% extends 'core/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4 p-4">
            <div class="text-center mb-4">
                <div class="bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 60px; height: 60px;">
                    <span class="fs-2">🔐</span>
                </div>
                <h3 class="fw-bold text-primary mb-1">¡Bienvenido!</h3>
                <p class="text-muted small">Inicia sesión y gestiona tus proyectos 💼</p>
            </div>
            <hr class="text-muted opacity-25 mb-4">
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3 text-start">
                        <label for="{{ field.id_for_label }}" class="form-label fw-bold">
                            {% if field.name == 'username' %}
                                Usuario
                            {% else %}
                                {{ field.label }}
                            {% endif %}
                        </label>
                        <input type="{{ field.field.widget.input_type }}" 
                               name="{{ field.name }}" 
                               id="{{ field.id_for_label }}" 
                               class="form-control form-control-lg" 
                               required>
                               
                        {% for error in field.errors %}
                            <div class="text-danger small mt-1">{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endfor %}
                
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg fs-6 fw-bold shadow-sm">Iniciar Sesión</button>
                </div>
                <div class="text-center mt-4">
                    <small class="text-muted">¿Aún no tienes cuenta? <a href="{% url 'registro' %}" class="fw-bold text-decoration-none">Regístrate aquí</a></small>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
