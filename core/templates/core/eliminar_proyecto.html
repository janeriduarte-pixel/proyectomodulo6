{% extends 'core/base.html' %}

{% block content %}
<div class="card shadow border-0 p-4 text-center">
    <h3 class="text-danger mb-3">¿Estás seguro de eliminar este proyecto?</h3>
    <p class="text-muted">Se borrará el proyecto <strong>"{{ object.nombre }}"</strong> y todas sus tareas asociadas.</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'lista_proyectos' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
