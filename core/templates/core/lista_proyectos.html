{% extends 'core/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Mis Proyectos📚</h2>
    <a href="{% url 'crear_proyecto' %}" class="btn btn-primary"> + Nuevo Proyecto</a>
</div>
<div class="list-group shadow-sm">
    {% for proyecto in proyectos %}
        <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3">
            <div>
                <h5 class="mb-1">
                    <a href="{% url 'detalle_proyecto' proyecto.id %}" class="text-decoration-none fw-bold">{{ proyecto.nombre }}</a>
                </h5>
                <p class="mb-0 text-muted">{{ proyecto.descripcion }}</p>
            </div>
            <div>
                <a href="{% url 'editar_proyecto' proyecto.id %}" class="btn btn-sm btn-outline-secondary me-2">Editar</a>
                <a href="{% url 'eliminar_proyecto' proyecto.id %}" class="btn btn-sm btn-outline-danger">Eliminar</a>
            </div>
        </div>
    {% empty %}
        <div class="alert alert-info text-center">No tienes proyectos todavía. ¡Crea uno nuevo!</div>
    {% endfor %}
</div>
{% endblock %}
