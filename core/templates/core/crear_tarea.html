{% extends 'core/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow border-0 p-4">
            <h3 class="text-primary fw-bold mb-3">➕ Nueva Tarea</h3>
            <p class="text-muted mb-4">Ingresa los detalles de la tarea que deseas agregar al proyecto.</p>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    {{ form.as_p }}
                </div>
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="{% url 'detalle_proyecto' view.kwargs.proyecto_id %}" class="btn btn-outline-secondary">
                        &larr; Volver a mis proyectos
                    </a>
                    <button type="submit" class="btn btn-primary px-4">
                        💾 Guardar Tarea
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
